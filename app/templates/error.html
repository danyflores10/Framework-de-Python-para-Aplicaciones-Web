{% extends './layout.html' %}
{% from 'macros.html' import icono %}

{% block title %}{{ titulo }}{% endblock %}

{% block body %}
<section class="tarjeta error-pagina">

    <h1>{{ titulo }}</h1>

    <div class="acciones acciones--centradas">

    </div>

{% endblock %}
